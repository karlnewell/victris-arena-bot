# Short-lived helper to copy trained networks off the victris-models volume.
#   kubectl apply -f fetch-pod.yaml && kubectl -n i2-llm wait --for=condition=Ready pod/victris-fetch
#   kubectl -n i2-llm cp victris-fetch:/out/league-gpu ../models/league-gpu
#   kubectl -n i2-llm delete pod victris-fetch
apiVersion: v1
kind: Pod
metadata:
  name: victris-fetch
  namespace: i2-llm
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 900
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: [us-west]
  containers:
    - name: fetch
      image: busybox:1.36
      command: ["sleep", "600"]
      volumeMounts:
        - { name: models, mountPath: /out }
      resources:
        requests: { cpu: 100m, memory: 128Mi, ephemeral-storage: 100Mi }
        limits: { cpu: 120m, memory: 150Mi, ephemeral-storage: 120Mi }
  volumes:
    - name: models
      persistentVolumeClaim: { claimName: victris-models }
