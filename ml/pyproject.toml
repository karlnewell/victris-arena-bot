[project]
name = "obsidian-edge-ml"
version = "0.1.0"
description = "Learned policy for the obsidian-edge Victris Arena bot"
requires-python = ">=3.11"
dependencies = [
    "arena-sim",
    "numpy>=2.4.6",
    "python-socks>=3.2.1",
    "torch>=2.15.0",
    "websockets>=15",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
arena-sim = { url = "https://assets.victris.ai/download/0.75.1/arena_sim-0.75.1-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]
